trigger:
  - main

pool:
  name: Default

variables:
  imageName: ghcr.io/kiryue0/mini-task-api

steps:
  - script: go build ./...
    displayName: 'Build'

  - script: go test ./...
    displayName: 'Test'

  - script: docker build -t $(imageName):$(Build.BuildId) .
    displayName: 'Docker build'

  - script: echo $GHCR_TOKEN | docker login ghcr.io -u kiryue0 --password-stdin
    displayName: 'GHCR login'
    env:
      GHCR_TOKEN: $(GHCR_TOKEN)

  - script: docker push $(imageName):$(Build.BuildId)
    displayName: 'GHCR push'